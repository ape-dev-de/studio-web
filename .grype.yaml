---
# grype config — vulnerability scan ignore rules.
# Wird vom Concourse-Step grype-scan automatisch via --config geladen,
# wenn die Datei im app-repo-Root liegt (siehe infra/pipelines/_lib/grype-scan.yml).
#
# Jeder ignore-Eintrag MUSS begründet sein. Reviewbarer Pfad: PR-Diff hier.

ignore:
  # syft binary-classifier matcht irgendeinen Statamic-CP-JS-Bundle-Bytes gegen
  # Cygwins Selbst-Marker-Version "1.3.22-dontuse-21" (upstream-Marker, kein
  # echtes Paket). Distroless-Image (chainguard/static + FrankenPHP) hat keine
  # cygwin1.dll — der CVE (Cygwin DLL buffer overflow, 2016, Windows-only)
  # ist hier nicht reachable. Daher kategorisch ignorieren.
  - vulnerability: CVE-2016-3067
