---
# grype config — vulnerability scan ignore rules.
# Wird vom Concourse-Step grype-scan automatisch via --config geladen,
# wenn die Datei im app-repo-Root liegt (siehe infra/pipelines/_lib/grype-scan.yml).
#
# Jeder ignore-Eintrag MUSS begründet sein. Reviewbarer Pfad: PR-Diff hier.

ignore:
  # syft binary-classifier matcht den Statamic-CP-JS-Bundle gegen Cygwins
  # Selbst-Marker-Version "1.3.22-dontuse-21" (upstream-Tag, kein echtes Paket).
  # Cygwin gibt es im Image gar nicht — distroless chainguard/static + FrankenPHP.
  # CVE-2016-3067 ist ein Cygwin1.dll-Buffer-Overflow von 2016, hier nicht erreichbar.
  - vulnerability: CVE-2016-3067
    package:
      name: Cygwin
